name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target
        run: cargo clippy --all-targets -- -D warnings
      - name: Test every target
        run: cargo test --all-targets

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Expose standalone LLVM verifier
        run: echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select stable Rust
        run: rustup default stable
      - name: Show native toolchain
        run: |
          uname -m
          xcrun clang --version
          llvm-as --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target
        run: cargo clippy --all-targets -- -D warnings
      - name: Test every non-window target
        run: cargo test --all-targets -- --skip native_command_builds_runs_and_stops_after_its_frame_limit

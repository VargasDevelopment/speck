[package]
name = "speck"
version = "0.1.0"
edition = "2024"
description = "A tiny compiled language for tiny native games"
license = "MIT"
repository = "https://github.com/VargasDevelopment/speck"

[dependencies]
ctrlc = "3.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
